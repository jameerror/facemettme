name: Linux CPU and container checks
on: [push, pull_request, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libgomp1
      - run: python -m pip install -r requirements.txt
      - run: bash -n install.sh start.sh
      - run: python -m unittest discover -s tests -v
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
      - run: docker build -t face-swap-me:test .
      - name: Test the Linux container without model downloads
        run: docker run --rm face-swap-me:test python -m unittest discover -s tests -v
